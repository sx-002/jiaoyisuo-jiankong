name: 交易所风险哨兵（定时推送）

on:
  push:
    branches: [main]
  schedule:
    # 每小时一次，避开整点（GitHub 整点高负载会丢任务）。
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 离线自检
        # push 只干跑：中间态失败不发失败邮件；定时/手动仍按真实失败处理。
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          python main.py --self-check
          python -m unittest discover -s tests -v

      - name: 从 state 分支恢复去重状态
        # push 只干跑：中间态失败不发失败邮件；定时/手动仍按真实失败处理。
        continue-on-error: ${{ github.event_name == 'push' }}
        run: bash scripts/restore_state.sh

      - name: 采集（定时与手动才真推送，push 触发只干跑）
        # push 只干跑：中间态失败不发失败邮件；定时/手动仍按真实失败处理。
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          ANYSEARCH_KEYS: ${{ secrets.ANYSEARCH_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "事件 push：只干跑，不推送 Telegram；去重状态写单独的 dryrun 文件，不动正式状态。"
            python main.py --dry-run --report report.json --max-queries 12 --state state/dryrun-state.json
          else
            echo "事件 ${{ github.event_name }}：正式推送 Telegram。"
            python main.py --send --report report.json --max-queries 12
          fi
          code=$?
          set -e
          echo "采集退出码 $code（0=全成功，1=部分源失败且已隔离，2/3/5=需处理）"
          if [ "$code" -gt 1 ]; then exit "$code"; fi

      - name: 保存状态到 state 分支
        # 只有真正推送的轮次才写正式状态；push 的干跑不能污染去重库，否则定时推送会被吃掉。
        if: always() && github.event_name != 'push'
        run: bash scripts/persist_state.sh

      - name: 上传运行报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiankong-report-${{ github.run_number }}
          path: report.json
          retention-days: 14
